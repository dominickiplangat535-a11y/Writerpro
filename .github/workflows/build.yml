name: Build WriterPro APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            build-essential \
            openjdk-17-jdk

      - name: Install Android SDK and NDK
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358"

          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/28.2.13676358" >> $GITHUB_ENV

      - name: Install python-for-android
        run: |
          python -m pip install --upgrade pip
          python -m pip install "python-for-android==2026.5.9"

      - name: Show build versions
        run: |
          python --version
          python -m pythonforandroid.toolchain --version
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"

      - name: Build WriterPro APK
        run: |
          python -m pythonforandroid.toolchain apk \
            --private . \
            --package=org.writerpro.app \
            --name="WriterPro" \
            --version=1.0 \
            --bootstrap=sdl2 \
            --requirements=python3 \
            --arch=arm64-v8a \
            --orientation=portrait \
            --android-api=35 \
            --ndk-api=24

      - name: Find APK
        run: |
          find . -name "*.apk" -type f -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WriterPro-APK
          path: "**/*.apk"
          if-no-files-found: error
