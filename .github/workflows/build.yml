name: Build WriterPro APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip \
            python3-venv \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            libffi-dev \
            libssl-dev \
            pkg-config \
            cmake \
            build-essential

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install python-for-android
        run: |
          python -m pip install --upgrade pip
          python -m pip install python-for-android

      - name: Clean previous builds
        run: |
          python -m pythonforandroid.toolchain clean_all || true

      - name: Build APK
        run: |
          python -m pythonforandroid.toolchain apk \
            --private . \
            --package=org.writerpro.app \
            --name="WriterPro" \
            --version=1.0 \
            --bootstrap=sdl2 \
            --requirements=python3==3.11.9,hostpython3==3.11.9,pygame \
            --arch=arm64-v8a \
            --orientation=portrait \
            --android-api=35 \
            --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WriterPro-APK
          path: "**/*.apk"
