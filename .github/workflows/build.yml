          python3 -m pythonforandroid.toolchain apk \
            --private . \
            --package=org.writerpro.app \
            --name="WriterPro" \
            --version=1.0 \
            --bootstrap=sdl2 \
            --requirements=python3,sdl2 \
            --arch=arm64-v8a \
            --orientation=portrait

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WriterPro-APK
          path: "**/*.apk"
