name: Build WriterPro APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config

      - name: Install python-for-android
        run: |
          python3 -m pip install --user --upgrade python-for-android

      - name: Build APK
        run: |
          python3 -m pythonforandroid.toolchain apk \
            --private . \
            --package=org.writerpro.app \
            --name="WriterPro" \
            --version=1.0 \
            --bootstrap=sdl2 \
            --requirements=python3,sdl2 \
            --arch=arm64-v8a \
            --orientation=portrait

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WriterPro-APK
          path: "**/*.apk"
