name: Build WriterPro APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Get source code
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip \
            python3-venv \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            libtool-bin \
            libltdl-dev \
            pkg-config \
            build-essential \
            openjdk-17-jdk

      - name: Install Python build dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install cython
          python3 -m pip install python-for-android

      - name: Build APK
        run: |
          python3 -m pythonforandroid.toolchain apk \
            --private . \
            --package=org.writerpro.app \
            --name="WriterPro" \
            --version=1.0 \
            --bootstrap=sdl2 \
            --requirements=python3,sdl2 \
            --arch=arm64-v8a \
            --orientation=portrait \
            --android-api=35

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WriterPro-APK
          path: "**/*.apk"
